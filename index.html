<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>GPA Calculator</h1>
        <table id="gradeTable">
            <thead>
                <tr><th>Subject</th><th>Grade</th><th>Units</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="result-box">
            <h3>Total GPA: <span id="gpaResult">0.00</span></h3>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
